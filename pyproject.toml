[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lgs-directory"
version = "0.1.0"
description = "US Local Game Store Online Presence Database"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0,<3.0",
    "psycopg[binary]>=3.1,<4.0",
    "alembic>=1.13,<2.0",
    "click>=8.1,<9.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "rich>=13.0,<14.0",
    "httpx>=0.27,<1.0",
    "thefuzz[speedup]>=0.22,<1.0",
    "playwright>=1.40,<2.0",
    "beautifulsoup4>=4.12,<5.0",
    "anthropic>=0.39,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.4,<1.0",
    "mypy>=1.10,<2.0",
]

[project.scripts]
lgs = "lgs_directory.cli.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/lgs_directory"]

[tool.ruff]
src = ["src", "tests"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
